name: ZAP Renew

on:
  schedule:
    - cron: '0 0 * * 1'  # 每周一 UTC 00:00 (北京时间 08:00)
    - cron: '0 0 * * 3'  # 每周三北京时间 08:00，周一漏跑或失败时补跑
  workflow_dispatch:  # 手动触发

permissions:
  contents: read
  actions: read  # 只读查询本工作流的定时运行记录

concurrency:
  group: zap-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ZAP_ACCOUNT: ${{ secrets.ZAP_ACCOUNT || secrets.ACCOUNTS_ZAP || secrets.ACCOUNTS }}
      YESCAPTCHA_API_KEY: ${{ secrets.YESCAPTCHA_API_KEY }}
      ZAP_PROXY_URL: ${{ secrets.ZAP_PROXY_URL }}
      STAY_DURATION: '10'
      LOGIN_WAIT_DURATION: '30'
      ZAP_BASE_URL: 'https://legacy.zap-hosting.com'
      ZAP_VPS_URL: 'https://legacy.zap-hosting.com/en/customer/vserver/show/623379/overview/'
      SMTP_HOST: 'smtp.qq.com'
      SMTP_PORT: '465'
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_TO: ${{ secrets.SMTP_TO }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check weekly schedule
        id: schedule_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_weekly_schedule.py

      - name: Validate configuration
        if: steps.schedule_check.outputs.should_run == 'true'
        shell: bash
        run: |
          if [ -z "$ZAP_ACCOUNT" ] || [ -z "$YESCAPTCHA_API_KEY" ]; then
            echo '请在 Repository secrets 中配置 ZAP_ACCOUNT 和 YESCAPTCHA_API_KEY'
            exit 1
          fi
          if [ -z "$SMTP_USERNAME" ] || [ -z "$SMTP_PASSWORD" ] || [ -z "$SMTP_TO" ]; then
            echo '请配置邮件通知所需的 SMTP_USERNAME、SMTP_PASSWORD、SMTP_TO secrets'
            exit 1
          fi
      
      - name: Install dependencies
        if: steps.schedule_check.outputs.should_run == 'true'
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
          sudo apt-get install -y xvfb xauth
      
      - name: Run renew script
        if: steps.schedule_check.outputs.should_run == 'true'
        run: xvfb-run python -u zap-renew.py
        timeout-minutes: 15
