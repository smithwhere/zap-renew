name: ZAP Renew

on:
  schedule:
    - cron: '0 0 * * 1'  # 每周一 UTC 00:00 (北京时间 08:00)
    - cron: '0 0 * * 3'  # 每周三北京时间 08:00，周一漏跑或失败时补跑
  workflow_dispatch:  # 手动触发
    inputs:
      verify_live:
        description: '实站验证：正常登录并打开目标 VPS，遇到验证码即停止'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read  # 只读查询本工作流的定时运行记录

concurrency:
  group: zap-renew
  cancel-in-progress: false

env:
  ZAP_VPS_URL: 'https://legacy.zap-hosting.com/en/customer/vserver/show/623379/overview/'

jobs:
  renew:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.verify_live)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ZAP_ACCOUNT: ${{ secrets.ZAP_ACCOUNT || secrets.ACCOUNTS_ZAP || secrets.ACCOUNTS }}
      STAY_DURATION: '10'
      LOGIN_WAIT_DURATION: '3'
      SMTP_HOST: 'smtp.qq.com'
      SMTP_PORT: '465'
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_TO: ${{ secrets.SMTP_TO }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check weekly schedule
        id: schedule_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_weekly_schedule.py

      - name: Validate configuration
        if: steps.schedule_check.outputs.should_run == 'true'
        shell: bash
        run: |
          if [ -z "$ZAP_ACCOUNT" ]; then
            echo '请在 Repository secrets 中配置 ZAP_ACCOUNT'
            exit 1
          fi
          if [ -z "$SMTP_USERNAME" ] || [ -z "$SMTP_PASSWORD" ] || [ -z "$SMTP_TO" ]; then
            echo '请配置邮件通知所需的 SMTP_USERNAME、SMTP_PASSWORD、SMTP_TO secrets'
            exit 1
          fi
      
      - name: Install dependencies
        if: steps.schedule_check.outputs.should_run == 'true'
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      
      - name: Run renew script
        if: steps.schedule_check.outputs.should_run == 'true'
        run: python -u zap-renew.py --renew
        timeout-minutes: 15

  verify-live:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_live
    name: Verify Classic Panel access
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install verification dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Verify live login and VPS page
        env:
          ZAP_ACCOUNT: ${{ secrets.ZAP_ACCOUNT || secrets.ACCOUNTS_ZAP || secrets.ACCOUNTS }}
        run: python -u zap-renew.py --verify-live
        timeout-minutes: 5
